version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kanban_db
    environment:
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: kanban_password
      POSTGRES_DB: kanban_db
    ports:
      - "5432:5432"
    volumes:
      - kanban_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kanban_db_data:
